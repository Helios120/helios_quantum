<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>HeliosAstro • Multi-cercles interactifs GIF</title>

<style>
:root{
  --cyan:#48f5ff;
  --gold:#ffd75a;
  --pink:#ff55cb;
  --green:#78ff9f;
  --text:#eaf8ff;
  --panel:rgba(3,10,22,.76);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020713;
  color:var(--text);
  font-family:Inter,Segoe UI,Arial,sans-serif;
}
body{
  background:
  radial-gradient(circle at 50% 48%,rgba(72,245,255,.18),transparent 38%),
  radial-gradient(circle at 50% 50%,rgba(255,85,203,.10),transparent 62%),
  linear-gradient(135deg,#01030a,#06101d 50%,#010208);
}
#app{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}
canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}
.top{
  position:absolute;
  z-index:30;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  pointer-events:none;
}
.top h1{
  margin:0;
  color:var(--gold);
  font-size:20px;
  letter-spacing:.18em;
  text-shadow:0 0 18px rgba(255,215,90,.55);
}
.top p{
  margin:5px 0 0;
  color:#9cecff;
  font-size:11px;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.panel{
  position:absolute;
  z-index:20;
  border:1px solid rgba(80,210,255,.25);
  background:var(--panel);
  backdrop-filter:blur(14px);
  box-shadow:0 0 30px rgba(0,0,0,.55);
  border-radius:16px;
  color:#dffaff;
}
.left{
  left:14px;
  top:66px;
  width:295px;
  bottom:82px;
  padding:14px;
  overflow:auto;
}
.right{
  right:14px;
  top:66px;
  width:295px;
  bottom:82px;
  padding:14px;
  overflow:auto;
}
.bar{
  position:absolute;
  z-index:25;
  left:50%;
  bottom:14px;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
  align-items:center;
  padding:8px;
  border:1px solid rgba(80,210,255,.25);
  border-radius:16px;
  background:rgba(3,10,22,.75);
  backdrop-filter:blur(12px);
}
h2{
  font-size:12px;
  margin:0 0 12px;
  color:var(--cyan);
  text-transform:uppercase;
  letter-spacing:.1em;
}
.field{margin-bottom:11px}
label{
  display:block;
  color:#9bc7d8;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-bottom:5px;
}
input,textarea{
  width:100%;
  background:rgba(0,0,0,.25);
  border:1px solid rgba(72,245,255,.20);
  border-radius:10px;
  color:#eaf8ff;
  padding:10px;
  outline:none;
  font-size:15px;
}
textarea{
  height:70px;
  resize:none;
}
button{
  border:1px solid rgba(80,210,255,.30);
  background:rgba(4,16,32,.88);
  color:#dffaff;
  border-radius:10px;
  padding:10px 13px;
  cursor:pointer;
  text-transform:uppercase;
  font-weight:800;
  letter-spacing:.06em;
}
button:hover{
  border-color:var(--cyan);
  box-shadow:0 0 18px rgba(72,245,255,.22);
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.stat,.planet{
  display:flex;
  justify-content:space-between;
  gap:8px;
  border-bottom:1px solid rgba(72,245,255,.12);
  padding:6px 0;
  font-size:12px;
}
.stat b,.planet b{
  color:var(--gold);
}
.planet span:first-child{
  font-size:18px;
}
.status{
  margin-top:10px;
  color:#9cecff;
  font-size:12px;
  line-height:1.45;
}
.immersive .panel,
.immersive .top{
  opacity:.06;
}
.immersive .panel:hover,
.immersive .top:hover{
  opacity:1;
}
@media(max-width:1050px){
  .right{display:none}
  .left{width:260px}
  .top h1{font-size:15px}
}
@media(max-width:700px){
  .top{
    left:0;
    right:0;
    transform:none;
    width:100%;
    padding:0 10px;
  }
  .top h1{
    font-size:15px;
    line-height:1.25;
  }
  .left{
    left:10px;
    right:10px;
    width:auto;
    bottom:82px;
    top:auto;
    height:42vh;
  }
  .bar{
    left:10px;
    right:10px;
    bottom:8px;
    transform:none;
    display:grid;
    grid-template-columns:repeat(3,1fr);
  }
  .bar button{
    font-size:10px;
    padding:9px 4px;
  }
}
</style>
</head>

<body>
<div id="app">
  <canvas id="hud"></canvas>

  <div class="top">
    <h1>HELIOS ASTRO • MULTI-CERCLES VIVANTS</h1>
    <p>Mandala 360° • cercles synchronisés • export PNG / GIF</p>
  </div>

  <section class="panel left">
    <h2>Données natales</h2>

    <div class="field">
      <label>Date</label>
      <input id="date" type="date" value="1988-05-15">
    </div>

    <div class="field">
      <label>Heure</label>
      <input id="time" type="time" value="14:30">
    </div>

    <div class="field">
      <label>Lieu</label>
      <input id="place" value="Paris, France">
    </div>

    <div class="grid">
      <button id="calc">Recalculer</button>
      <button id="png">PNG</button>
    </div>

    <div class="grid" style="margin-top:8px">
      <button id="gif">GIF</button>
      <button id="burst">Burst</button>
    </div>

    <div class="field" style="margin-top:14px">
      <label>Question / intention</label>
      <textarea id="intent">mémoire, lumière, interaction</textarea>
    </div>

    <button id="encode" style="width:100%">Encoder dans les cercles</button>

    <h2 style="margin-top:18px">État vivant</h2>
    <div class="stat">Moteur <b>actif</b></div>
    <div class="stat">Cercles <b id="circleCount">0</b></div>
    <div class="stat">Mémoire 360° <b id="mem">4%</b></div>
    <div class="stat">Réponse <b id="resp">0%</b></div>
    <div class="stat">Photons <b id="flux">0</b></div>

    <div class="status" id="status">
      PNG et GIF disponibles. Le GIF capture 24 images du canvas.
    </div>
  </section>

  <section class="panel right">
    <h2>Résumé</h2>
    <div id="summary"></div>

    <h2 style="margin-top:18px">Planètes</h2>
    <div id="planetList"></div>
  </section>

  <div class="bar">
    <button id="pause">Pause</button>
    <button id="brain">Cerveau</button>
    <button id="immersive">Immersion</button>
    <button id="full">Plein écran</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gifshot@0.4.5/build/gifshot.min.js"></script>

<script>
(()=>{
"use strict";

const canvas=document.getElementById("hud");
const ctx=canvas.getContext("2d",{alpha:false});
const app=document.getElementById("app");
const $=id=>document.getElementById(id);

let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));

const TAU=Math.PI*2;
const signs=["Bélier","Taureau","Gémeaux","Cancer","Lion","Vierge","Balance","Scorpion","Sagittaire","Capricorne","Verseau","Poissons"];
const glyphs=["♈","♉","♊","♋","♌","♍","♎","♏","♐","♑","♒","♓"];
const planets=[
  ["Soleil","☉",0,1,"#ffd75a"],
  ["Lune","☽",38,13.2,"#48f5ff"],
  ["Mercure","☿",82,4.1,"#37eaff"],
  ["Vénus","♀",118,1.6,"#78ff9f"],
  ["Mars","♂",152,.8,"#ff5548"],
  ["Jupiter","♃",210,.20,"#ff9840"],
  ["Saturne","♄",256,.09,"#ffd75a"],
  ["Uranus","♅",300,.045,"#48f5ff"],
  ["Neptune","♆",332,.025,"#9968ff"],
  ["Pluton","♇",25,.016,"#ff55cb"]
];

let S={
  w:1,h:1,t:0,last:performance.now(),
  run:true,
  brain:true,
  stars:[],
  circles:[],
  links:[],
  signals:[],
  photons:[],
  learn:Array(360).fill(.04),
  response:0,
  sunDeg:55,
  mouse:{x:-999,y:-999}
};

const hue=d=>((d%360)+360)%360;
const norm=d=>((d%360)+360)%360;
const ang=d=>(d-90)*Math.PI/180;
const avg=()=>S.learn.reduce((a,b)=>a+b,0)/360;

function signName(deg){
  return signs[Math.floor(norm(deg)/30)];
}

function degText(deg){
  let d=norm(deg)%30;
  return Math.floor(d)+"°";
}

function days(date,time){
  return (new Date(`${date}T${time||"12:00"}:00`)-new Date("2000-01-01T12:00:00"))/86400000;
}

function sun(date){
  let [y,m,d]=date.split("-").map(Number);
  let md=[0,31,59,90,120,151,181,212,243,273,304,334][m-1]+d;
  let st=[80,110,141,172,204,235,266,296,326,356,21,50];
  let idx=0;

  for(let i=0;i<12;i++){
    let a=st[i],b=st[(i+1)%12];
    let ok=i===9 ? md>=a || md<st[10] : (a<b ? md>=a && md<b : md>=a || md<b);
    if(ok){idx=i;break}
  }

  let deg=(st[idx]<=md?md-st[idx]:md+365-st[idx]);
  return idx*30+Math.min(29.9,deg*.9856);
}

function resize(){
  dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  S.w=window.innerWidth;
  S.h=window.innerHeight;
  canvas.width=S.w*dpr;
  canvas.height=S.h*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);

  S.stars=Array.from({length:S.w<700?160:320},()=>({
    x:Math.random()*S.w,
    y:Math.random()*S.h,
    r:Math.random()*1.25+.1,
    a:Math.random()*.46+.04,
    h:180+Math.random()*170,
    p:Math.random()*TAU
  }));

  buildMandala();
}

window.addEventListener("resize",resize);

function buildMandala(){
  const mob=S.w<700;
  const cx=mob?S.w*.67:S.w/2;
  const cy=mob?S.h*.34:S.h/2+10;
  const R=mob?Math.min(S.w,S.h)*.30:Math.max(220,Math.min(S.w-640,S.h-130)*.45);

  const cs=[];
  cs.push({
    x:cx,y:cy,r:R*.18,
    layer:0,idx:0,
    phase:0,spin:.35,h:45
  });

  [
    {n:8,orbit:.33,r:.12},
    {n:12,orbit:.55,r:.13},
    {n:18,orbit:.78,r:.12},
    {n:24,orbit:1.0,r:.105}
  ].forEach((L,li)=>{
    for(let i=0;i<L.n;i++){
      let a=i*TAU/L.n+(li*.13);
      cs.push({
        x:cx+Math.cos(a)*R*L.orbit,
        y:cy+Math.sin(a)*R*L.orbit,
        r:R*L.r,
        layer:li+1,
        idx:i,
        phase:i*.37+li,
        spin:(i%2?-1:1)*(.18+li*.04),
        h:hue(li*70+i*360/L.n)
      });
    }
  });

  S.circles=cs;
  S.links=[];
  for(let i=1;i<cs.length;i++){
    S.links.push([0,i]);
    if(i>1) S.links.push([i-1,i]);
  }

  $("circleCount").textContent=cs.length;
}

function bg(t){
  ctx.fillStyle="#020713";
  ctx.fillRect(0,0,S.w,S.h);

  const g=ctx.createRadialGradient(S.w/2,S.h/2,0,S.w/2,S.h/2,Math.max(S.w,S.h)*.75);
  g.addColorStop(0,"rgba(72,245,255,.18)");
  g.addColorStop(.45,"rgba(5,20,40,.45)");
  g.addColorStop(1,"rgba(1,3,10,.95)");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,S.w,S.h);

  ctx.save();
  ctx.globalCompositeOperation="lighter";
  for(const st of S.stars){
    ctx.fillStyle=`hsla(${st.h},90%,72%,${st.a*(.5+.5*Math.sin(t+st.p))})`;
    ctx.beginPath();
    ctx.arc(st.x,st.y,st.r,0,TAU);
    ctx.fill();
  }
  ctx.restore();
}

function masterRosace(t){
  if(!S.circles.length)return;

  const c0=S.circles[0];
  const R=Math.max(...S.circles.map(c=>Math.hypot(c.x-c0.x,c.y-c0.y)+c.r));

  ctx.save();
  ctx.translate(c0.x,c0.y);
  ctx.globalCompositeOperation="lighter";

  for(let r=.15;r<=1.05;r+=.10){
    ctx.strokeStyle=`rgba(72,245,255,${.05+r*.07})`;
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.arc(0,0,R*r,0,TAU);
    ctx.stroke();
  }

  for(let arm=0;arm<24;arm++){
    ctx.beginPath();
    for(let i=0;i<=120;i++){
      let n=i/120;
      let a=arm*TAU/24+n*4.8+t*.22;
      let r=R*n*n;
      let x=Math.cos(a)*r;
      let y=Math.sin(a)*r;
      if(i===0)ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }
    ctx.strokeStyle=`hsla(${hue(arm*18+t*70)},100%,65%,.16)`;
    ctx.lineWidth=1.2;
    ctx.stroke();
  }

  ctx.restore();
}

function drawLinks(t){
  ctx.save();
  ctx.globalCompositeOperation="lighter";

  for(let i=0;i<S.links.length;i++){
    const [a,b]=S.links[i];
    const A=S.circles[a];
    const B=S.circles[b];
    if(!A||!B)continue;

    const mx=(A.x+B.x)/2+Math.sin(t+i)*20;
    const my=(A.y+B.y)/2+Math.cos(t+i)*20;

    ctx.strokeStyle=`hsla(${hue(A.h+B.h+t*50)},100%,70%,.14)`;
    ctx.lineWidth=.7;
    ctx.beginPath();
    ctx.moveTo(A.x,A.y);
    ctx.quadraticCurveTo(mx,my,B.x,B.y);
    ctx.stroke();
  }

  ctx.restore();
}

function miniCircle(c,t,index){
  const hover=Math.max(0,1-Math.hypot(S.mouse.x-c.x,S.mouse.y-c.y)/(c.r*2.2));
  const rr=c.r*(1+hover*.18);

  ctx.save();
  ctx.translate(c.x,c.y);
  ctx.rotate(t*c.spin+c.phase);
  ctx.beginPath();
  ctx.arc(0,0,rr,0,TAU);
  ctx.clip();

  const g=ctx.createRadialGradient(0,0,0,0,0,rr);
  g.addColorStop(0,"rgba(255,255,255,.70)");
  g.addColorStop(.18,`hsla(${hue(c.h+t*30)},100%,70%,.45)`);
  g.addColorStop(.55,"rgba(20,80,255,.18)");
  g.addColorStop(1,"rgba(0,0,0,.20)");
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(0,0,rr,0,TAU);
  ctx.fill();

  ctx.globalCompositeOperation="lighter";

  for(let k=0;k<7;k++){
    ctx.strokeStyle=`hsla(${hue(c.h+k*55+t*60)},100%,68%,.20)`;
    ctx.lineWidth=.7;
    ctx.beginPath();
    for(let i=0;i<=90;i++){
      let n=i/90;
      let a=n*TAU*(1.2+k*.12)+t*.5+k;
      let r=rr*(.08+n*.78);
      let x=Math.cos(a)*r;
      let y=Math.sin(a)*r*.55;
      if(i===0)ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }

  for(let i=0;i<12;i++){
    let a=i*TAU/12-t*.3;
    ctx.fillStyle=`hsla(${hue(i*30+t*80)},100%,70%,.8)`;
    ctx.beginPath();
    ctx.arc(Math.cos(a)*rr*.58,Math.sin(a)*rr*.58,Math.max(1.4,rr*.025),0,TAU);
    ctx.fill();
  }

  ctx.globalCompositeOperation="source-over";
  ctx.strokeStyle="rgba(72,245,255,.55)";
  ctx.lineWidth=Math.max(1,rr*.018);
  ctx.beginPath();
  ctx.arc(0,0,rr*.98,0,TAU);
  ctx.stroke();

  ctx.restore();
}

function brain(t){
  if(!S.brain||!S.circles.length)return;
  const c=S.circles[0];
  const R=c.r*1.4;

  ctx.save();
  ctx.globalCompositeOperation="screen";

  for(let i=0;i<90;i++){
    let a=i*2.399+t*.18;
    let rr=R*(.05+.42*((i%37)/37));
    let x=c.x+Math.cos(a)*rr;
    let y=c.y+Math.sin(a)*rr*.75;
    let v=S.learn[i%360];

    ctx.fillStyle=`hsla(${180+v*140},100%,70%,${.12+v*.45})`;
    ctx.beginPath();
    ctx.arc(x,y,1+v*3,0,TAU);
    ctx.fill();
  }

  ctx.restore();
}

function spawn(n,base){
  for(let i=0;i<n;i++){
    let c=S.circles[Math.floor(Math.random()*S.circles.length)]||{x:S.w/2,y:S.h/2,r:100,h:0};
    let d=Number.isFinite(base)?base+i*137.5:Math.random()*360;

    S.photons.push({
      c:S.circles.indexOf(c),
      d,
      r:.02+Math.random()*.1,
      life:0,
      ttl:2.4+Math.random()*6.5,
      s:.45+Math.random()*1.7,
      h:hue(d+c.h),
      w:Math.random()*TAU
    });
  }

  if(S.photons.length>1100){
    S.photons.splice(0,S.photons.length-1100);
  }
}

function drawPhotons(t){
  ctx.save();
  ctx.globalCompositeOperation="lighter";

  for(let i=S.photons.length-1;i>=0;i--){
    let p=S.photons[i];
    let c=S.circles[p.c]||S.circles[0];
    if(!c)continue;

    p.life+=.012*p.s;
    if(p.life>p.ttl){
      S.photons.splice(i,1);
      continue;
    }

    p.d=(p.d+.22*p.s)%360;
    p.r=Math.min(1,p.r+.0016*p.s);

    let a=ang(p.d+Math.sin(t*4+p.w)*10);
    let orbit=c.r*(.22+p.r*.95);
    let x=c.x+Math.cos(a)*orbit;
    let y=c.y+Math.sin(a)*orbit;

    ctx.fillStyle=`hsla(${hue(p.h+t*38)},100%,74%,${.55*(1-p.life/p.ttl)})`;
    ctx.beginPath();
    ctx.arc(x,y,1.1+p.r*2.2,0,TAU);
    ctx.fill();
  }

  ctx.restore();
}

function compute(){
  let ds=days($("date").value,$("time").value);
  S.sunDeg=sun($("date").value);

  planets.forEach((p,i)=>{
    p[2]=(i===0?S.sunDeg:(S.sunDeg+p[2]+ds*p[3])%360+360)%360;
  });

  renderList();
  encode(($("intent").value||"Helios Astro")+" "+$("date").value+" "+$("time").value);
}

function encode(text){
  String(text).split("").forEach((ch,i)=>{
    let c=ch.charCodeAt(0)&255;
    let deg=(i*137.507+c)%360;

    for(let k=-4;k<=4;k++){
      let idx=(Math.floor(deg+k)+360)%360;
      S.learn[idx]=Math.min(1,S.learn[idx]+.015);
    }
  });

  S.response=Math.min(1,S.response+.22);
  spawn(220,S.sunDeg);
}

function renderList(){
  $("summary").innerHTML=
    `<div class="stat">Soleil <b>${signName(S.sunDeg)}</b></div>
     <div class="stat">Degré <b>${degText(S.sunDeg)}</b></div>
     <div class="stat">Lieu <b>${$("place").value||"—"}</b></div>
     <p style="font-size:12px;line-height:1.55;color:#cdefff;margin-top:10px">
       Les cercles échangent photons, mémoire et signaux visuels dans une matrice 360°.
     </p>`;

  $("planetList").innerHTML=planets.map(p=>
    `<div class="planet">
      <span style="color:${p[4]}">${p[1]}</span>
      <span>${p[0]}</span>
      <b>${degText(p[2])} ${signName(p[2])}</b>
    </div>`
  ).join("");
}

function frame(now){
  let dt=Math.min(.05,(now-S.last)/1000);
  S.last=now;

  if(S.run)S.t+=dt;
  let t=S.t;

  S.response*=.995;

  bg(t);
  masterRosace(t);
  drawLinks(t);
  S.circles.forEach((c,i)=>miniCircle(c,t,i));
  brain(t);
  drawPhotons(t);

  $("mem").textContent=Math.floor(avg()*100)+"%";
  $("resp").textContent=Math.floor(S.response*100)+"%";
  $("flux").textContent=S.photons.length;

  if(S.run&&Math.random()<.045)spawn(3);

  requestAnimationFrame(frame);
}

function exportPNG(){
  const a=document.createElement("a");
  a.href=canvas.toDataURL("image/png");
  a.download="helios-multi-cercles.png";
  a.click();
}

function exportGIF(){
  const status=$("status");
  status.textContent="Création du GIF en cours...";

  const frames=[];
  let count=0;
  const total=24;

  function capture(){
    frames.push(canvas.toDataURL("image/png"));
    count++;

    if(count<total){
      setTimeout(capture,90);
    }else{
      if(!window.gifshot){
        status.textContent="Erreur : gifshot non chargé. Vérifie ta connexion internet.";
        return;
      }

      gifshot.createGIF({
        images:frames,
        gifWidth:canvas.width/dpr,
        gifHeight:canvas.height/dpr,
        interval:.09,
        numFrames:total
      },function(obj){
        if(!obj.error){
          const a=document.createElement("a");
          a.href=obj.image;
          a.download="helios-multi-cercles.gif";
          a.click();
          status.textContent="GIF exporté.";
        }else{
          status.textContent="Erreur export GIF.";
        }
      });
    }
  }

  capture();
}

function fullscreen(){
  if(!document.fullscreenElement){
    app.requestFullscreen?.();
  }else{
    document.exitFullscreen?.();
  }
}

canvas.addEventListener("pointermove",e=>{
  S.mouse.x=e.clientX;
  S.mouse.y=e.clientY;
});

canvas.addEventListener("pointerdown",e=>{
  S.mouse.x=e.clientX;
  S.mouse.y=e.clientY;
  spawn(140,Math.random()*360);
});

$("calc").onclick=compute;
$("encode").onclick=()=>encode($("intent").value);
$("png").onclick=exportPNG;
$("gif").onclick=exportGIF;
$("burst").onclick=()=>spawn(300,Math.random()*360);
$("pause").onclick=()=>{
  S.run=!S.run;
  $("pause").textContent=S.run?"Pause":"Play";
};
$("brain").onclick=()=>{
  S.brain=!S.brain;
};
$("immersive").onclick=()=>{
  app.classList.toggle("immersive");
};
$("full").onclick=fullscreen;

resize();
compute();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
